[package]
name = "simple-git-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Software rendering only (no "wgpu"): the GPU backend loads the graphics
# driver, which alone costs 100+ MB of RAM for this simple flat UI.
iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "tokio",
    "svg",
    "canvas",
] }
libc = "0.2.191"
rfd = "0.17.2"
rust-i18n = "4.2.4"
shell-words = "1.1.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.0", features = ["process", "time", "macros", "rt-multi-thread", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
