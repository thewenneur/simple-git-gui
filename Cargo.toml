[package]
name = "simple-git-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Both renderers are built; main.rs picks the software one (tiny-skia) unless
# SIMPLE_GIT_GPU=1: the GPU one (wgpu) loads the graphics driver, which costs
# 100+ MB of RAM for this simple flat UI.
iced = { version = "0.14.0", features = ["tokio", "svg"] }
libc = "0.2.191"
rfd = "0.17.2"
rust-i18n = "4.2.4"
shell-words = "1.1.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.0", features = ["process", "time", "macros", "rt-multi-thread", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
