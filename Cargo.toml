[package]
name = "simple-git-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Both renderers are built; main.rs picks one per platform to save memory
# (see `choose_renderer`).
iced = { version = "0.14.0", features = ["tokio", "svg", "canvas", "advanced"] }
libc = "0.2.191"
png = "0.17"
rfd = "0.17.2"
rust-i18n = "4.2.4"
serde_json = "1"
shell-words = "1.1.1"
sys-locale = "0.3.2"
tokio = { version = "1.54.0", features = ["process", "time", "macros", "rt-multi-thread", "io-util", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"

# Smaller portable executables.
[profile.release]
lto = "thin"
strip = true

# Embeds the icon and version details in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
