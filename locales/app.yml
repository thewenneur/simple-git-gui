  en: "Copy"
  fr: "Copier"
drop.move_intro:
  en: "%{branch} will point at « %{subject} ». Its old position is kept under refs/backup/%{branch}."
  fr: "%{branch} pointera sur « %{subject} ». Son ancienne position est gardée sous refs/backup/%{branch}."
drop.move_current_intro:
  en: "You are on %{branch}: it will point at « %{subject} » and your files follow (git refuses if that would lose local changes). Its old position is kept under refs/backup/%{branch}."
  fr: "Vous êtes sur %{branch} : elle pointera sur « %{subject} » et vos fichiers suivent (git refuse si cela perdait des modifications locales). Son ancienne position est gardée sous refs/backup/%{branch}."
drop.move_button:
  en: "Move"
  fr: "Déplacer"
drop.push_intro:
  en: "Your commits of %{branch} go to %{remote}. If a colleague sent something meanwhile, git refuses: get it first."
  fr: "Vos commits de %{branch} partent vers %{remote}. Si un collègue a envoyé quelque chose entre-temps, git refuse : récupérez d'abord."
drop.push_button:
  en: "Send"
  fr: "Envoyer"
drop.push_not_undoable:
  en: "Once sent, it can't be undone with Ctrl+Z"
  fr: "Une fois envoyé, Ctrl+Z ne peut plus l'annuler"
drop.pushed:
  en: "%{branch} sent."
  fr: "%{branch} envoyée."
drop.pull_intro:
  en: "%{branch} moves forward to %{remote}. If both have different commits, git refuses: go onto %{branch} and use Get."
  fr: "%{branch} avance jusqu'à %{remote}. Si les deux ont des commits différents, git refuse : allez sur %{branch} et utilisez Récupérer."
drop.pull_button:
  en: "Get"
  fr: "Récupérer"
drop.swap:
  en: "Swap their order"
  fr: "Échanger leur ordre"
drop.squash:
  en: "Squash into one commit"
  fr: "Les fusionner en un seul commit"
drop.swap_intro:
  en: "« %{newer} » goes before « %{older} ». The commits get new ids; nothing else changes."
  fr: "« %{newer} » passe avant « %{older} ». Les commits reçoivent de nouveaux identifiants ; rien d'autre ne change."
drop.squash_intro:
  en: "« %{newer} » is merged into « %{older} »: one commit with both changes and both messages."
  fr: "« %{newer} » est fusionné dans « %{older} » : un seul commit avec les deux changements et les deux messages."
drop.swap_button:
  en: "Swap"
  fr: "Échanger"
drop.squash_button:
  en: "Squash"
  fr: "Fusionner"
drop.rebase_after_note:
  en: "Only the commits after %{commit} are moved; the ones before stay where they are."
  fr: "Seuls les commits après %{commit} sont déplacés ; ceux d'avant restent où ils sont."

