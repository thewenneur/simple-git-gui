# Merge and rebase assistant
integrate.merge_title:
  en: "Bring %{branch} into %{into}?"
  fr: "Intégrer %{branch} dans %{into} ?"
integrate.merge_intro:
  en: "The commits of %{branch} join %{into} with a merge commit. Nothing is saved before you have checked the result."
  fr: "Les commits de %{branch} rejoignent %{into} par un commit de fusion. Rien n'est enregistré avant que vous ayez vérifié le résultat."
integrate.merge_button:
  en: "Merge"
  fr: "Fusionner"
integrate.rebase_title:
  en: "Replay %{branch} after %{onto}?"
  fr: "Rejouer %{branch} après %{onto} ?"
integrate.rebase_intro:
  en: "Your commits of %{branch} are replayed one by one after the last commit of %{onto}. The history stays in a straight line; the commits get new ids."
  fr: "Vos commits de %{branch} sont rejoués un par un après le dernier commit de %{onto}. L'historique reste en ligne droite ; les commits reçoivent de nouveaux identifiants."
integrate.rebase_button:
  en: "Rebase"
  fr: "Rebaser"
integrate.rebase_pushed:
  en: "%{branch} is already on the server. After this rebase, sending it will have to replace the server's version (without overwriting a colleague's work: --force-with-lease)."
  fr: "%{branch} est déjà sur le serveur. Après ce rebase, l'envoi devra remplacer la version du serveur (sans écraser le travail d'un collègue : --force-with-lease)."
integrate.ignore_whitespace:
  en: "Ignore changes of spaces and line endings (fewer false conflicts)"
  fr: "Ignorer les changements d'espaces et de fins de ligne (moins de faux conflits)"
integrate.autostash:
  en: "Your local changes are set aside during the operation and put back afterwards."
  fr: "Vos modifications locales sont mises de côté pendant l'opération, puis remises."
integrate.steps:
  en: "If both branches changed the same lines, the assistant shows each side with its branch name so you can choose. Conflicts you settle are remembered and settled the same way if they come back (rerere)."
  fr: "Si les deux branches ont changé les mêmes lignes, l'assistant montre chaque côté avec le nom de sa branche pour que vous choisissiez. Les conflits résolus sont mémorisés et résolus de la même façon s'ils reviennent (rerere)."
integrate.loading:
  en: "Reading the operation in progress…"
  fr: "Lecture de l'opération en cours…"
integrate.into:
  en: "into"
  fr: "dans"
integrate.onto:
  en: "replayed after"
  fr: "rejoué après"
