  en: "Welcome to Simple Git"
  fr: "Bienvenue dans Simple Git"
tutorial.offer_intro:
  en: "A short guided tour on a practice repository created in a temporary folder: nothing you do there touches your work. Pick a track:"
  fr: "Une courte visite guidée sur un dépôt d'entraînement créé dans un dossier temporaire : rien de ce que vous y faites ne touche à votre travail. Choisissez un parcours :"
tutorial.offer_hint:
  en: "You can replay it any time from the ? button at the top."
  fr: "Vous pouvez le rejouer à tout moment depuis le bouton ? en haut."
tutorial.track_hardware:
  en: "Hardware (VHDL, FPGA)"
  fr: "Matériel (VHDL, FPGA)"
tutorial.track_hardware_hint:
  en: "See a change, save it, undo, get and send, branches and conflicts."
  fr: "Voir une modification, l'enregistrer, annuler, récupérer et envoyer, branches et conflits."
tutorial.track_design:
  en: "Design"
  fr: "Design"
tutorial.track_design_hint:
  en: "See a change, save it, undo, get and send, and locking binary files."
  fr: "Voir une modification, l'enregistrer, annuler, récupérer et envoyer, et verrouiller les fichiers binaires."
tutorial.track_advanced:
  en: "Advanced"
  fr: "Avancé"
tutorial.track_advanced_hint:
  en: "The branch tree, drag and drop, the conflict assistant and workspaces."
  fr: "L'arbre des branches, le glisser-déposer, l'assistant de conflits et les espaces de travail."
