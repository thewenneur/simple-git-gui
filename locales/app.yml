  fr: "Ce dossier existe déjà et n'est pas vide : choisissez-en un autre."
workspaces.bad_name:
  en: "This name can't be a branch name (no spaces, no ~ ^ : ? * [ \\ or ..)."
  fr: "Ce nom ne peut pas être un nom de branche (pas d'espace, ni ~ ^ : ? * [ \\ ou ..)."
