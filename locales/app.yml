  fr: "« %{at} » n'est ni une branche ni un commit de ce dépôt."
workspaces.switch_refused:
  en: "This branch is already open in the workspace %{folder}. A branch can only be in one workspace at a time: open that workspace to work on it."
  fr: "Cette branche est déjà ouverte dans l'espace de travail %{folder}. Une branche ne peut être que dans un seul espace de travail à la fois : ouvrez cet espace pour y travailler."
workspaces.force_intro_submodules:
  en: "The folder %{folder} and its downloaded submodules will be deleted (git worktree remove --force). Changes inside the submodules would be lost."
  fr: "Le dossier %{folder} et ses sous-modules téléchargés seront supprimés (git worktree remove --force). Les modifications faites dans les sous-modules seraient perdues."
workspaces.remove_submodules:
  en: "Git only removes a workspace whose submodules were downloaded when forced: turn on advanced mode and use « Remove… »."
  fr: "Git ne supprime un espace de travail dont les sous-modules sont téléchargés qu'en forçant : activez le mode avancé et utilisez « Supprimer… »."

