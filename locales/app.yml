integrate.file_review:
  en: "Merged automatically, to review"
  fr: "Fusionné automatiquement, à relire"
integrate.false_conflicts_note:
  en: "Changes of spaces and line endings are ignored, which avoids false conflicts. The conflicts you settle here are reused if the same conflict comes back (rerere)."
  fr: "Les changements d'espaces et de fins de ligne sont ignorés, ce qui évite les faux conflits. Les résolutions faites ici sont réutilisées si le même conflit revient (rerere)."
integrate.no_files:
  en: "No conflict: git combined both sides by itself. Check the result in History if you want, then save."
  fr: "Aucun conflit : git a combiné les deux côtés tout seul. Vérifiez le résultat dans l'historique si vous voulez, puis enregistrez."
