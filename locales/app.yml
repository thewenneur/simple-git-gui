  fr: "Astuce : glissez une branche ou un commit sur « Espaces de travail » dans la barre latérale pour l'ouvrir dans un nouvel espace de travail."
workspaces.form_intro:
  en: "A new folder is created with the files of what you choose. The repository and its history stay shared."
  fr: "Un nouveau dossier est créé avec les fichiers de ce que vous choisissez. Le dépôt et son historique restent partagés."
