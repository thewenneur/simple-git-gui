name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # No debug info in CI: much smaller target/ to build, cache and upload
  # (Windows .pdb files are the bulk of it).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes the cache; pull requests reuse it. Saving is the
          # slowest step on Windows (several minutes to pack target/).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
