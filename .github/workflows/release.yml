name: Release

# Installers and portable executables; nothing else to install besides Git.
# - Windows: a setup .exe (Inno Setup, per user by default) and a portable
#   .exe, with the C runtime linked in.
# - macOS: a universal (Apple Silicon + Intel) Simple Git.app in a .dmg.
# - Linux: an AppImage, and a .tar.gz with the binary, its menu entry, icon and
#   an install.sh for the current user.
# A pushed tag `v*` attaches them to a GitHub release; a manual run (or a
# pull request changing the packaging) only keeps them as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Changes to the packaging itself are checked before they are merged.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - assets/icon/**
      - build.rs

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          # The oldest supported runner, so the binary runs on older glibc.
          - name: linux-x86_64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Windows file details only take numbers: 0.1.0-rc.1 -> 0.1.0.
          numeric=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "numeric=${numeric%%-*}" >> "$GITHUB_OUTPUT"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked
          mkdir dist
          cp target/release/simple-git-gui.exe "dist/simple-git-gui-${{ steps.version.outputs.version }}-windows-x86_64-portable.exe"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DNumericVersion=${{ steps.version.outputs.numeric }}" "/DSourceExe=$PWD\target\release\simple-git-gui.exe" "/DOutputDir=$PWD\dist" packaging\windows\simple-git.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist build/dmg
          app="build/dmg/Simple Git.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/simple-git-gui" \
            target/aarch64-apple-darwin/release/simple-git-gui \
            target/x86_64-apple-darwin/release/simple-git-gui
          sed "s/VERSION/${{ steps.version.outputs.version }}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/icon/simple-git.icns "$app/Contents/Resources/"
          # Not notarized: an ad-hoc signature lets it run after "Open" in the Finder menu.
          codesign --force --deep --sign - "$app"
          # The disk image shows the app next to an Applications shortcut to drag it
          # onto, and a script adding the `simple-git-gui` terminal command.
          ln -s /Applications build/dmg/Applications
          cp packaging/macos/install-terminal-command.command "build/dmg/Install Terminal Command.command"
          dmg="dist/simple-git-gui-${{ steps.version.outputs.version }}-macos-universal.dmg"
          # hdiutil sometimes fails with "Resource busy" on CI runners: retry.
          for i in 1 2 3 4; do
            hdiutil create -volname "Simple Git" -srcfolder build/dmg -fs HFS+ -format UDZO -ov "$dmg" && break
            sleep 5
          done
          test -f "$dmg"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          version="${{ steps.version.outputs.version }}"
          id=io.github.thewenneur.simple-git-gui
          name="simple-git-gui-$version-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/simple-git-gui README.md packaging/linux/install.sh packaging/linux/$id.desktop "dist/$name/"
          cp assets/icon/simple-git-256.png "dist/$name/$id.png"
          cp assets/icon/simple-git.svg "dist/$name/$id.svg"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          version="${{ steps.version.outputs.version }}"
          id=io.github.thewenneur.simple-git-gui
          appdir=build/SimpleGit.AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp target/release/simple-git-gui "$appdir/usr/bin/"
          cp packaging/linux/$id.desktop "$appdir/"
          cp packaging/linux/$id.desktop "$appdir/usr/share/applications/"
          cp assets/icon/simple-git-256.png "$appdir/$id.png"
          cp assets/icon/simple-git-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/$id.png"
          ln -s usr/bin/simple-git-gui "$appdir/AppRun"
          # appimagetool checks the menu entry with desktop-file-validate.
          sudo apt-get install -y -q desktop-file-utils
          curl -fsSL -o build/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool
          # No FUSE on the runner: the tool unpacks itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 build/appimagetool --no-appstream "$appdir" "dist/simple-git-gui-$version-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      # The notes written for this version (docs/release-notes/<version>.md),
      # followed by GitHub's list of merged pull requests. A release is created
      # as a draft: it is published by hand once its files are checked.
      - name: Release notes
        run: |
          notes="src/docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          draft: true
