# Temporary probe: measures the app's memory on a real macOS session.
name: macOS memory probe

on:
  push:
    branches: [claude/project-thread-uw9h8t]

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: system_profiler SPDisplaysDataType | grep -iE "resolution|retina|ui looks" || true
      - run: |
          cargo build --release && cp target/release/simple-git-gui /tmp/small
          sed -i '' 's/window_size((1280.0, 800.0))/window_size((1900.0, 1000.0))/' src/main.rs
          cargo build --release && cp target/release/simple-git-gui /tmp/large
      - name: Measure
        run: |
          git clone -q . /tmp/repo
          measure() {
            label=$1
            "$2" /tmp/repo & pid=$!
            sleep 20
            echo "=== $label after 20s"
            footprint $pid | head -14 || true
            sleep 40
            echo "=== $label after 60s"
            footprint $pid | head -6 || true
            screencapture -x "/tmp/$label.png" || true
            kill $pid; sleep 2
          }
          measure small /tmp/small
          measure large /tmp/large
          SIMPLE_GIT_GPU=1 measure small-gpu /tmp/small
          SIMPLE_GIT_GPU=1 measure large-gpu /tmp/large
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: /tmp/*.png
